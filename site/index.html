<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex of Fire · what NASA knows about fire in the air people will breathe</title>
<meta name="description" content="Pick a cabin atmosphere and see every flame NASA's PSI repository holds for it: ranked investigations, each test at true scale, and a model for the air nobody has tested.">
<meta name="generator" content="HTML, CSS and JavaScript. Data from NASA PSI.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <section class="ledger" aria-label="Ledger: investigations and tests">
    <header class="brand" data-x="brand">
      <span class="flame-dot" aria-hidden="true"></span>
      <span class="word">Codex of Fire</span>
      <label class="search" data-x="search">
        <span class="sr">Search investigations and tests</span>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-list">
        <kbd id="search-kbd">⌘K</kbd>
        <div class="search-list" id="search-list" role="listbox" hidden></div>
      </label>
    </header>
    <div class="brief" id="brief"></div>
    <div class="thead" id="thead"></div>
    <div class="rows" id="rows" tabindex="-1"></div>
    <footer class="foot" id="foot"></footer>
  </section>

  <main class="stage" id="stage" aria-label="Stage">
    <div class="view" id="view-cabin"></div>
    <div class="view test" id="view-test" hidden>
      <header class="stage-head" id="test-head"></header>
      <div class="viewport" id="viewport" data-x="viewport">
        <canvas id="flame" aria-hidden="true"></canvas>
        <div id="overlays"></div>
      </div>
      <div class="scrub" id="scrub-box">
        <div class="top">
          <button class="play" id="play" type="button" aria-label="Pause"></button>
          <span class="t" id="t-label" data-x="time">t = 0.0 s</span>
          <span class="end" id="t-end"></span>
        </div>
        <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Time since ignition">
        <div class="ticks" id="scrub-ticks"></div>
      </div>
      <div class="strip" id="strip" hidden></div>
      <div class="console" id="test-console"></div>
    </div>
  </main>

  <aside class="cabins" aria-label="Cabins: choose the air">
    <div class="cabins-head" data-x="ladder">
      <span class="t-numeral-s">Cabins</span>
      <span class="t-micro">Lit where NASA has burned something</span>
    </div>
    <div class="ladder" id="ladder"></div>
    <div id="card"></div>
    <button class="dock" id="dock" type="button" data-x="ogonek"></button>
  </aside>
</div>
<div class="tip" id="tip" hidden></div>

<script src="data/codex-data.js"></script>
<script src="data/calibration.js"></script>
<script src="model/firex-lite.js"></script>
<script src="model/flame-gl.js"></script>
<script src="model/flame-render.js"></script>
<script src="js/select.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/cabins.js"></script>
<script src="js/ledger.js"></script>
<script src="js/stage-cabin.js"></script>
<script src="js/burn.js"></script>
<script src="js/stage-test.js"></script>
<script src="js/ogonek.js"></script>
<script src="js/search.js"></script>
<script src="js/main.js"></script>
</body>
</html>
